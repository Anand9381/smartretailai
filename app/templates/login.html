<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | SmartRetailAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/landing.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}" />
</head>
<body class="landing-page">
  <nav class="navbar">
    <a href="{{ url_for('public_landing') }}" class="navbar-brand">
      <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="16" cy="16" r="14" stroke="currentColor" stroke-width="2"/>
        <path d="M16 8v8m-6-2h12M10 18h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      SmartRetailAI
    </a>
    <div class="navbar-menu">
      <a href="{{ url_for('public_landing') }}" class="home-link">☷ Home</a>
      <a href="{{ url_for('login') }}" class="text-link">Login</a>
      <a href="{{ url_for('signup') }}" class="btn btn-primary">Register</a>
    </div>
  </nav>

  <div class="auth-container auth-themed-bg">
    <div class="auth-card card">
      <div class="auth-header">
        <div class="auth-icon">↪</div>
        <h2>Welcome Back</h2>
        <p class="text-muted">Choose whether you are signing in as a customer or an admin.</p>
      </div>

      <form class="auth-form" id="loginForm">
        <div class="form-group">
          <label class="form-label">Username / Email Address</label>
          <div class="form-input-wrapper">
            <span class="form-input-icon">✉</span>
            <input type="email" class="form-input" placeholder="you@example.com" required />
          </div>
        </div>

        <div class="form-group">
          <div class="form-label-wrapper">
            <label class="form-label">Password</label>
            <a href="#" class="forgot-link">Forgot password?</a>
          </div>
          <div class="form-input-wrapper">
            <span class="form-input-icon">🔒</span>
            <input type="password" class="form-input" id="password" placeholder="••••••••" required />
            <button type="button" class="password-toggle" onclick="togglePassword('password')">👁</button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Continue</button>
      </form>

      <div class="auth-footer">
        <p class="text-muted">Don’t have an account? <a href="{{ url_for('signup') }}" class="signup-link">Create one</a></p>
      </div>

      <div class="auth-divider"><span>Choose login type</span></div>
      <div class="role-buttons">
        <button type="button" class="role-btn active" data-role="user" onclick="selectRole(this)"><span class="role-icon">👤</span><span>Customer Login</span></button>
        <button type="button" class="role-btn" data-role="admin" onclick="selectRole(this)"><span class="role-icon">🛠</span><span>Admin Login</span></button>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
