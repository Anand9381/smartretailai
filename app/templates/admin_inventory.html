<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventory | SmartRetailAI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}" />
</head>
<body>
  <div class="dashboard-container">
    <aside class="sidebar">
      <div class="sidebar-header"><a href="{{ url_for('public_landing') }}" class="sidebar-brand">SmartRetailAI</a></div>
      <nav class="sidebar-nav">
        <a href="{{ url_for('admin_chat') }}" class="nav-item">🤖 <span>Assistant</span></a>
        <a href="{{ url_for('admin_inventory') }}" class="nav-item active">📦 <span>Inventory</span></a>
        <a href="{{ url_for('admin_forecast') }}" class="nav-item">📈 <span>ML Forecast</span></a>
        <a href="{{ url_for('admin_analytics') }}" class="nav-item">📉 <span>Power BI Analytics</span></a>
        <a href="{{ url_for('admin_orders') }}" class="nav-item">🧾 <span>Orders</span></a>
      </nav>
      <div class="sidebar-footer">
        <p class="user-role">Signed in as admin</p>
        <a href="{{ url_for('logout') }}" class="logout-btn" style="display:block; text-align:center; text-decoration:none;">Logout</a>
      </div>
    </aside>

    <main class="main-content">
      <div class="section-header">
        <div>
          <h2>Inventory Management</h2>
          <p class="text-muted">Products are stored in MongoDB and new items added here will be saved there too.</p>
        </div>
      </div>

      <section class="card" style="margin-bottom: 1.5rem;">
        <h3 style="margin-bottom: 1rem;">Add Product</h3>
        <form id="inventoryCreateForm" style="display:grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem;">
          <input class="form-input" name="name" placeholder="Product name" required />
          <input class="form-input" name="slug" placeholder="Slug (optional)" />
          <input class="form-input" name="category" placeholder="Category" />
          <input class="form-input" name="price" type="number" min="0" step="0.01" placeholder="Price" required />
          <input class="form-input" name="stock" type="number" min="0" step="1" placeholder="Stock" value="0" />
          <input class="form-input" name="badge" placeholder="Badge" value="New" />
          <input class="form-input" name="image" placeholder="Image URL" style="grid-column: span 3;" />
          <textarea class="form-input" name="desc" placeholder="Description" rows="3" style="grid-column: span 3; resize: vertical;"></textarea>
          <div style="grid-column: span 3; display:flex; justify-content:flex-end;">
            <button class="btn btn-primary" type="submit">Save Product</button>
          </div>
        </form>
      </section>

      <div class="orders-table-wrapper">
        <table class="orders-table">
          <thead>
            <tr>
              <th>Product</th>
              <th>Category</th>
              <th>Stock</th>
              <th>Price</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </main>
  </div>
</body>
<script src="{{ url_for('static', filename='js/inventory.js') }}"></script>
</html>
