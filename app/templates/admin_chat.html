<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Assistant | SmartRetailAI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/chat.css') }}" />
  <style>
    /* Admin chat page overrides */
    .monitoring-main {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      height: calc(100vh - 2rem);
      padding: 1.5rem 2rem;
    }

    .monitoring-header {
      flex-shrink: 0;
    }

    .monitoring-header h1 {
      font-size: 1.6rem;
      margin: 0;
      color: #fff;
    }

    .monitoring-header p {
      color: rgba(255,255,255,0.55);
      margin: 0.25rem 0 0;
      font-size: 0.9rem;
    }

    .monitoring-chat-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: rgba(14, 16, 30, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    .monitoring-chat-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-shrink: 0;
    }

    .monitoring-chat-header .agent-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, #a855f7 0%, #d946ef 100%);
      display: grid;
      place-items: center;
      font-size: 1.3rem;
      flex-shrink: 0;
    }

    .monitoring-chat-header .agent-info h3 {
      font-size: 1rem;
      margin: 0;
      color: #fff;
    }

    .monitoring-chat-header .agent-info span {
      font-size: 0.8rem;
      color: #22c55e;
    }

    .monitoring-chat-header .agent-info span::before {
      content: '';
      display: inline-block;
      width: 7px;
      height: 7px;
      background: #22c55e;
      border-radius: 50%;
      margin-right: 5px;
      vertical-align: middle;
    }

    .monitoring-chat-window {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .monitoring-chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      padding: 0 1.5rem 1rem;
      flex-shrink: 0;
    }

    .monitoring-chip {
      background: rgba(217, 70, 239, 0.12);
      color: #f5d0fe;
      border: 1px solid rgba(217, 70, 239, 0.2);
      padding: 0.5rem 1rem;
      border-radius: 999px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .monitoring-chip:hover {
      background: rgba(217, 70, 239, 0.25);
      color: #fae8ff;
      transform: translateY(-1px);
    }

    .monitoring-compose {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      padding: 1rem 1.5rem;
      border-top: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
    }

    .monitoring-compose input {
      flex: 1;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.04);
      padding: 0.85rem 1.1rem;
      font-size: 0.95rem;
      color: #f8f8ff;
      border-radius: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .monitoring-compose input:focus {
      border-color: rgba(217, 70, 239, 0.45);
    }

    .monitoring-compose input::placeholder {
      color: rgba(248,248,255,0.4);
    }

    .monitoring-compose button {
      background: linear-gradient(135deg, #a855f7 0%, #d946ef 100%);
      color: white;
      border: none;
      width: 48px;
      height: 48px;
      border-radius: 14px;
      cursor: pointer;
      font-size: 1.2rem;
      display: grid;
      place-items: center;
      box-shadow: 0 8px 24px rgba(217, 70, 239, 0.3);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .monitoring-compose button:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 32px rgba(217, 70, 239, 0.4);
    }

    .monitoring-status {
      text-align: center;
      font-size: 0.85rem;
      color: rgba(248,248,255,0.5);
      padding: 0 1.5rem 0.75rem;
      flex-shrink: 0;
    }

    /* Admin monitoring message overrides */
    .monitoring-chat-window .chat-message.assistant .chat-bubble {
      background: rgba(217, 70, 239, 0.1);
      border: 1px solid rgba(217, 70, 239, 0.15);
      color: #fae8ff;
      border-bottom-left-radius: 6px;
      border-bottom-right-radius: 22px;
    }

    .monitoring-chat-window .chat-message.user .chat-bubble {
      background: linear-gradient(135deg, #a855f7 0%, #d946ef 100%);
      color: #fff;
      border-bottom-right-radius: 6px;
      border-bottom-left-radius: 22px;
    }
  </style>
</head>
<body>
  <div class="dashboard-container">
    <aside class="sidebar">
      <div class="sidebar-header"><a href="{{ url_for('public_landing') }}" class="sidebar-brand">SmartRetailAI</a></div>
      <nav class="sidebar-nav">
        <a href="{{ url_for('admin_chat') }}" class="nav-item active">🤖 <span>Assistant</span></a>
        <a href="{{ url_for('admin_inventory') }}" class="nav-item">📦 <span>Inventory</span></a>
        <a href="{{ url_for('admin_forecast') }}" class="nav-item">📈 <span>ML Forecast</span></a>
        <a href="{{ url_for('admin_analytics') }}" class="nav-item">📉 <span>Power BI Analytics</span></a>
        <a href="{{ url_for('admin_orders') }}" class="nav-item">🧾 <span>Orders</span></a>
      </nav>
      <div class="sidebar-footer">
        <p class="user-role">Signed in as admin</p>
        <a href="{{ url_for('logout') }}" class="logout-btn" style="display:block; text-align:center; text-decoration:none;">Logout</a>
      </div>
    </aside>

    <main class="main-content monitoring-main" data-chat-role="admin">
      <div class="monitoring-header">
        <h1>🤖 Admin Assistant Chat</h1>
        <p>Ask about stock levels, sales trends, business intelligence, and future demand predictions</p>
      </div>

      <div class="monitoring-chat-panel">
        <div class="monitoring-chat-header">
          <div class="agent-icon">👑</div>
          <div class="agent-info">
            <h3>Admin Assistant</h3>
            <span>Online — Monitoring & Analytics active</span>
          </div>
        </div>

        <div class="monitoring-chat-window" id="chatHistory" aria-live="polite" aria-label="Admin chat history"></div>

        <div class="monitoring-chip-row">
          <button class="monitoring-chip chat-chip" type="button">Which products are trending?</button>
          <button class="monitoring-chip chat-chip" type="button">Predict future high demand products</button>
          <button class="monitoring-chip chat-chip" type="button">Low stock alerts</button>
          <button class="monitoring-chip chat-chip" type="button">Why are Smart Watch Ultra sales increasing?</button>
          <button class="monitoring-chip chat-chip" type="button">Which products should we restock?</button>
          <button class="monitoring-chip chat-chip" type="button">Active offers</button>
        </div>

        <div class="monitoring-compose">
          <input id="messageInput" placeholder="Ask about monitoring or predictions..." />
          <button id="sendBtn" type="button" aria-label="Send message">➤</button>
        </div>

        <p class="monitoring-status" id="chatStatus" aria-live="polite"></p>
      </div>
    </main>
  </div>

  <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>
</html>
