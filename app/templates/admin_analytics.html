<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Power BI Analytics | SmartRetailAI Admin</title>
  <meta name="description" content="Embedded Power BI analytics dashboard for SmartRetailAI admin — sales, demand, and inventory insights." />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}" />
  <style>
    .powerbi-section {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      height: calc(100vh - 2rem);
    }
    .powerbi-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .powerbi-header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0;
    }
    .powerbi-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(243, 181, 0, 0.15);
      border: 1px solid rgba(243, 181, 0, 0.35);
      color: #f3b500;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.3rem 0.75rem;
      border-radius: 999px;
      letter-spacing: 0.03em;
    }
    .powerbi-subtitle {
      color: rgba(255,255,255,0.55);
      font-size: 0.875rem;
      margin: 0;
    }
    .powerbi-frame-wrapper {
      flex: 1;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 24px 72px rgba(0,0,0,0.35);
      background: #05060c;
      position: relative;
      min-height: 0;
    }
    .powerbi-frame-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    .powerbi-loading-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #08090f;
      gap: 1rem;
      transition: opacity 0.5s ease;
      z-index: 2;
    }
    .powerbi-loading-overlay.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 44px; height: 44px;
      border: 3px solid rgba(255,255,255,0.08);
      border-top-color: #f3b500;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .powerbi-loading-overlay p { color: rgba(255,255,255,0.4); font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="dashboard-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="{{ url_for('public_landing') }}" class="sidebar-brand">SmartRetailAI</a>
      </div>
      <nav class="sidebar-nav">
        <a href="{{ url_for('admin_chat') }}" class="nav-item">🤖 <span>Assistant</span></a>
        <a href="{{ url_for('admin_inventory') }}" class="nav-item">📦 <span>Inventory</span></a>
        <a href="{{ url_for('admin_forecast') }}" class="nav-item">📈 <span>ML Forecast</span></a>
        <a href="{{ url_for('admin_analytics') }}" class="nav-item active">📉 <span>Power BI Analytics</span></a>
        <a href="{{ url_for('admin_orders') }}" class="nav-item">🧾 <span>Orders</span></a>
      </nav>
      <div class="sidebar-footer">
        <p class="user-role">Signed in as admin</p>
        <a href="{{ url_for('logout') }}" class="logout-btn" style="display:block;text-align:center;text-decoration:none;">Logout</a>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content" style="overflow:hidden;">
      <div class="powerbi-section">
        <!-- Header -->
        <div class="powerbi-header">
          <div>
            <h1>📊 Power BI Analytics</h1>
            <p class="powerbi-subtitle">Live sales, demand &amp; inventory insights from your Power BI workspace.</p>
          </div>
          <span class="powerbi-badge">
            <svg width="10" height="10" viewBox="0 0 10 10" fill="currentColor"><circle cx="5" cy="5" r="4"/></svg>
            Live Report
          </span>
        </div>

        <!-- Power BI Iframe -->
        <div class="powerbi-frame-wrapper">
          <!-- Loading overlay -->
          <div class="powerbi-loading-overlay" id="pbiLoadingOverlay">
            <div class="spinner"></div>
            <p>Loading Power BI Report…</p>
          </div>

          <iframe
            id="powerbiIframe"
            src="https://app.powerbi.com/reportEmbed?reportId=b25d55f1-4089-44ca-9fd7-71f3d36f4e62&pageName=3e3960cb6a55302f057c&autoAuth=true&ctid={{ powerbi_tenant_id | default('') }}"
            allowfullscreen="true"
            title="SmartRetailAI Power BI Report"
            onload="document.getElementById('pbiLoadingOverlay').classList.add('hidden')"
            onerror="handlePbiError()"
          ></iframe>
        </div>
      </div>
    </main>
  </div>

  <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
  <script>
    function handlePbiError() {
      const overlay = document.getElementById('pbiLoadingOverlay');
      overlay.innerHTML = `
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <p style="color:rgba(255,255,255,0.4);text-align:center;max-width:320px;">
          Could not load the report directly.<br/>
          <a href="https://app.powerbi.com/groups/me/reports/b25d55f1-4089-44ca-9fd7-71f3d36f4e62/3e3960cb6a55302f057c?experience=power-bi"
             target="_blank" style="color:#f3b500;text-decoration:none;">Open in Power BI ↗</a>
        </p>`;
    }

    // Auto-hide loading after 15s as a safety net
    setTimeout(() => {
      document.getElementById('pbiLoadingOverlay').classList.add('hidden');
    }, 15000);
  </script>
</body>
</html>
