name: Build and deploy Python app to Azure Web App - smartretail-ai-v2

on:
  workflow_dispatch:
    inputs:
      azure_webapp_name:
        description: "New Azure Web App name"
        required: true
        default: "smartretail-ai-v2"
      slot_name:
        description: "Azure deployment slot"
        required: true
        default: "Production"

env:
  PYTHON_VERSION: "3.11"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Validate app before deployment
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m compileall application.py app.py agents routes services utils

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartretail-ai-v2-python-app
          path: |
            .
            !.git/
            !.venv/
            !.venv-1/
            !__pycache__/
            !**/__pycache__/
            !.pytest_cache/
            !repo-mirror.git/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: smartretail-ai-v2-python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_V2_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_V2_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_V2_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App v2
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ inputs.azure_webapp_name }}
          slot-name: ${{ inputs.slot_name }}
          package: .
