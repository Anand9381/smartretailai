<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Smart Retail Assistant</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <a href="index.html" class="navbar-brand">
      <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="16" cy="16" r="14" stroke="currentColor" stroke-width="2"/>
        <path d="M16 8v8m-6-2h12M10 18h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      Smart Retail
    </a>
    <div class="navbar-menu">
      <a href="index.html">Home</a>
      <a href="signup.html" class="btn btn-primary">Sign Up</a>
    </div>
  </nav>

  <!-- Auth Container -->
  <div class="auth-container">
    <div class="auth-card card">
      <div class="auth-header">
        <div class="auth-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
        </div>
        <h2>Welcome Back</h2>
        <p class="text-muted">Sign in to book products and manage your orders.</p>
      </div>

      <form class="auth-form" id="loginForm">
        <!-- Email Field -->
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <div class="form-input-wrapper">
            <svg class="form-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>
            </svg>
            <input type="email" class="form-input" placeholder="your@email.com" required>
          </div>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <div class="form-label-wrapper">
            <label class="form-label">Password</label>
            <a href="#" class="forgot-link">Forgot?</a>
          </div>
          <div class="form-input-wrapper">
            <svg class="form-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input type="password" class="form-input" placeholder="••••••••" id="password" required>
            <button type="button" class="password-toggle" onclick="togglePassword()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Sign In Button -->
        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
      </form>

      <!-- Sign Up Link -->
      <div class="auth-footer">
        <p class="text-muted">Don't have an account? <a href="signup.html" class="signup-link">Sign up here</a></p>
      </div>

      <!-- Divider -->
      <div class="auth-divider">
        <span>or</span>
      </div>

      <!-- Role Selection -->
      <div class="role-selection">
        <p class="role-label">Login as:</p>
        <div class="role-buttons">
          <button type="button" class="role-btn active" onclick="selectRole('customer')">
            <span class="role-icon">👤</span>
            <span>Customer</span>
          </button>
          <button type="button" class="role-btn" onclick="selectRole('admin')">
            <span class="role-icon">👨‍💼</span>
            <span>Admin</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/js/auth.js"></script>
</body>
</html>
