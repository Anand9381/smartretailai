<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Power BI Analytics | Smart Retail Admin</title>
  <meta name="description" content="Embedded Power BI analytics dashboard — live sales, demand, and inventory insights." />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/dashboard.css" />
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; }

    .powerbi-section {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      height: calc(100vh - 2rem);
      box-sizing: border-box;
    }

    .powerbi-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .powerbi-header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0;
    }
    .powerbi-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(243, 181, 0, 0.15);
      border: 1px solid rgba(243, 181, 0, 0.35);
      color: #f3b500;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.3rem 0.75rem;
      border-radius: 999px;
      letter-spacing: 0.03em;
    }
    .powerbi-badge svg { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .powerbi-subtitle {
      color: rgba(255,255,255,0.55);
      font-size: 0.875rem;
      margin: 0.25rem 0 0;
    }

    .powerbi-frame-wrapper {
      flex: 1;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 24px 72px rgba(0,0,0,0.35);
      background: #05060c;
      position: relative;
      min-height: 0;
    }
    .powerbi-frame-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Loading overlay */
    .powerbi-loading-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #08090f;
      gap: 1rem;
      transition: opacity 0.5s ease;
      z-index: 2;
    }
    .powerbi-loading-overlay.hidden { opacity: 0; pointer-events: none; }

    .spinner {
      width: 44px; height: 44px;
      border: 3px solid rgba(255,255,255,0.08);
      border-top-color: #f3b500;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .powerbi-loading-overlay p {
      color: rgba(255,255,255,0.4);
      font-size: 0.85rem;
      margin: 0;
    }

    /* Fullscreen button */
    .powerbi-toolbar {
      position: absolute;
      bottom: 1rem;
      right: 1rem;
      z-index: 3;
    }
    .powerbi-toolbar button {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.7);
      padding: 0.45rem 0.9rem;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: background 0.2s, color 0.2s;
    }
    .powerbi-toolbar button:hover {
      background: rgba(243,181,0,0.15);
      color: #f3b500;
      border-color: rgba(243,181,0,0.35);
    }
  </style>
</head>
<body>
  <div class="dashboard-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="index.html" class="sidebar-brand">
          <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="16" cy="16" r="14" stroke="currentColor" stroke-width="2"/>
            <path d="M16 8v8m-6-2h12M10 18h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span>Smart Retail</span>
        </a>
        <button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>
      </div>

      <nav class="sidebar-nav">
        <a href="admin-dashboard.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="12 3 20 7.5 20 16.5 12 21 4 16.5 4 7.5 12 3"/>
            <polyline points="12 12 20 7.5"/><polyline points="12 12 12 21"/><polyline points="12 12 4 7.5"/>
          </svg>
          <span>Dashboard</span>
        </a>
        <a href="admin-analytics.html" class="nav-item active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>
          </svg>
          <span>Power BI Analytics</span>
        </a>
        <a href="admin-inventory.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 2L5 6v12c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V6l-4-4z"/>
            <polyline points="16 13 12 9 8 13"/>
          </svg>
          <span>Inventory</span>
        </a>
        <a href="admin-orders.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
          </svg>
          <span>Orders</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-profile">
          <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=admin" alt="Admin">
          <div>
            <p class="user-name">Admin User</p>
            <p class="user-role">Administrator</p>
          </div>
        </div>
        <button class="logout-btn" onclick="window.location.href='login.html'">Logout</button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content" style="overflow:hidden;">
      <div class="powerbi-section">

        <!-- Header -->
        <div class="powerbi-header">
          <div>
            <h1>📊 Power BI Analytics</h1>
            <p class="powerbi-subtitle">Live sales, demand &amp; inventory insights from your Power BI workspace.</p>
          </div>
          <span class="powerbi-badge">
            <svg width="10" height="10" viewBox="0 0 10 10" fill="currentColor">
              <circle cx="5" cy="5" r="4"/>
            </svg>
            Live Report
          </span>
        </div>

        <!-- Power BI Iframe Container -->
        <div class="powerbi-frame-wrapper" id="pbiWrapper">

          <!-- Loading Overlay -->
          <div class="powerbi-loading-overlay" id="pbiLoadingOverlay">
            <div class="spinner"></div>
            <p>Loading Power BI Report…</p>
          </div>

          <!-- Power BI iframe - uses reportEmbed endpoint with autoAuth -->
          <iframe
            id="powerbiIframe"
            src="https://app.powerbi.com/reportEmbed?reportId=b25d55f1-4089-44ca-9fd7-71f3d36f4e62&pageName=3e3960cb6a55302f057c&autoAuth=true"
            allowfullscreen="true"
            title="SmartRetailAI Power BI Analytics Report"
            onload="onIframeLoad()"
            onerror="onIframeError()"
          ></iframe>

          <!-- Toolbar -->
          <div class="powerbi-toolbar" id="pbiToolbar" style="display:none;">
            <button onclick="toggleFullscreen()" title="Fullscreen">⛶ Fullscreen</button>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script src="assets/js/dashboard.js"></script>
  <script>
    function onIframeLoad() {
      document.getElementById('pbiLoadingOverlay').classList.add('hidden');
      document.getElementById('pbiToolbar').style.display = 'block';
    }

    function onIframeError() {
      const overlay = document.getElementById('pbiLoadingOverlay');
      overlay.innerHTML = `
        <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <div style="text-align:center;max-width:360px;">
          <p style="color:rgba(255,255,255,0.5);margin:0 0 0.75rem;">Unable to embed report directly.</p>
          <a href="https://app.powerbi.com/groups/me/reports/b25d55f1-4089-44ca-9fd7-71f3d36f4e62/3e3960cb6a55302f057c?experience=power-bi"
             target="_blank"
             style="display:inline-block;background:rgba(243,181,0,0.15);border:1px solid rgba(243,181,0,0.4);
                    color:#f3b500;padding:0.5rem 1.25rem;border-radius:8px;text-decoration:none;font-size:0.875rem;">
            Open in Power BI ↗
          </a>
        </div>`;
    }

    function toggleFullscreen() {
      const wrapper = document.getElementById('pbiWrapper');
      if (!document.fullscreenElement) {
        wrapper.requestFullscreen().catch(err => console.warn('Fullscreen error:', err));
      } else {
        document.exitFullscreen();
      }
    }

    // Safety net: auto-hide loader after 20 seconds
    setTimeout(() => {
      const overlay = document.getElementById('pbiLoadingOverlay');
      if (overlay && !overlay.classList.contains('hidden')) {
        overlay.classList.add('hidden');
        document.getElementById('pbiToolbar').style.display = 'block';
      }
    }, 20000);
  </script>
</body>
</html>
