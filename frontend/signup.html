<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Smart Retail Assistant</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <a href="index.html" class="navbar-brand">
      <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="16" cy="16" r="14" stroke="currentColor" stroke-width="2"/>
        <path d="M16 8v8m-6-2h12M10 18h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      Smart Retail
    </a>
    <div class="navbar-menu">
      <a href="index.html">Home</a>
      <a href="login.html" class="btn btn-primary">Login</a>
    </div>
  </nav>

  <!-- Auth Container -->
  <div class="auth-container">
    <div class="auth-card card">
      <div class="auth-header">
        <div class="auth-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
        <h2>Create Account</h2>
        <p class="text-muted">Join the smart retail platform today.</p>
      </div>

      <form class="auth-form" id="signupForm">
        <!-- Full Name Field -->
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <div class="form-input-wrapper">
            <svg class="form-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
            </svg>
            <input type="text" class="form-input" placeholder="John Doe" required>
          </div>
        </div>

        <!-- Email Field -->
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <div class="form-input-wrapper">
            <svg class="form-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>
            </svg>
            <input type="email" class="form-input" placeholder="your@email.com" required>
          </div>
        </div>

        <!-- Phone Field -->
        <div class="form-group">
          <label class="form-label">Phone Number</label>
          <div class="form-input-wrapper">
            <svg class="form-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
            </svg>
            <input type="tel" class="form-input" placeholder="+1 (555) 123-4567" required>
          </div>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="form-input-wrapper">
            <svg class="form-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input type="password" class="form-input" placeholder="••••••••" id="password" required>
            <button type="button" class="password-toggle" onclick="togglePassword('password')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Confirm Password Field -->
        <div class="form-group">
          <label class="form-label">Confirm Password</label>
          <div class="form-input-wrapper">
            <svg class="form-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input type="password" class="form-input" placeholder="••••••••" id="confirmPassword" required>
            <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Terms Checkbox -->
        <div class="form-group checkbox-group">
          <input type="checkbox" id="terms" required>
          <label for="terms" class="checkbox-label">I agree to the Terms & Conditions</label>
        </div>

        <!-- Sign Up Button -->
        <button type="submit" class="btn btn-primary btn-block">Create Account</button>
      </form>

      <!-- Sign In Link -->
      <div class="auth-footer">
        <p class="text-muted">Already have an account? <a href="login.html" class="signup-link">Sign in</a></p>
      </div>

      <!-- Role Selection -->
      <div class="auth-divider">
        <span>Select Role</span>
      </div>

      <div class="role-selection">
        <div class="role-buttons">
          <button type="button" class="role-btn active" onclick="selectRole('customer')">
            <span class="role-icon">👤</span>
            <span>Customer</span>
          </button>
          <button type="button" class="role-btn" onclick="selectRole('admin')">
            <span class="role-icon">👨‍💼</span>
            <span>Admin</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/js/auth.js"></script>
</body>
</html>
